<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 采购情报</title>
  <style>
    :root { --blue:#0066cc; --ink:#1d1d1f; --muted:#7a7a7a; --line:#e0e0e0; --bg:#f5f5f7; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
           color:var(--ink); background:var(--bg); line-height:1.5; }
    header { background:#fff; border-bottom:1px solid var(--line); padding:20px 32px; }
    header h1 { margin:0; font-size:22px; font-weight:600; }
    main { max-width:860px; margin:0 auto; padding:32px 20px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:12px;
            padding:24px; margin-bottom:24px; }
    .card h2 { margin:0 0 12px; font-size:16px; font-weight:600; }
    .stat { font-size:28px; font-weight:600; color:var(--blue); }
    .stat small { font-size:14px; color:var(--muted); font-weight:400; margin-left:6px; }
    button { background:var(--blue); color:#fff; border:0; border-radius:9999px;
             padding:10px 22px; font-size:15px; cursor:pointer; }
    button:disabled { background:#b8c6d6; cursor:default; }
    input[type=text] { width:100%; padding:12px 16px; font-size:15px;
             border:1px solid var(--line); border-radius:9999px; margin-bottom:12px; }
    .status { color:var(--muted); font-size:14px; margin-top:10px; }
    .status.running { color:#8a5a00; }
    .status.error { color:#c0392b; }
    .answer { white-space:pre-wrap; background:#fafafc; border:1px solid var(--line);
              border-radius:8px; padding:16px; margin-top:12px; font-size:15px; }
    .sources { margin-top:8px; font-size:14px; }
    .sources a { color:var(--blue); display:block; word-break:break-all; }
    .row { display:flex; gap:12px; align-items:flex-start; }
    .row input { flex:1; margin-bottom:0; }
  </style>
</head>
<body>
  <header><h1>AI 采购情报</h1></header>
  <main>
    <div class="card">
      <h2>知识库</h2>
      <div class="stat"><span id="docCount">…</span><small>篇公告已入库</small></div>
      <div style="margin-top:16px">
        <button id="ingestBtn">开始入库</button>
        <div class="status" id="ingestStatus"></div>
      </div>
    </div>

    <div class="card">
      <h2>问答</h2>
      <div class="row">
        <input type="text" id="question" placeholder="输入问题，例如：近期有哪些高校设备采购项目？">
        <button id="askBtn">提问</button>
      </div>
      <div class="status" id="askStatus"></div>
      <div class="answer" id="answer" style="display:none"></div>
      <div class="sources" id="sources"></div>
    </div>
  </main>

  <script>
    const $ = id => document.getElementById(id);

    async function refreshStats() {
      try {
        const r = await fetch("/api/stats");
        const d = await r.json();
        $("docCount").textContent = d.documents;
      } catch (e) { /* ignore */ }
    }

    async function pollIngest() {
      while (true) {
        const r = await fetch("/api/ingest/status");
        const d = await r.json();
        const el = $("ingestStatus");
        el.className = "status";
        if (d.status === "running") {
          el.className = "status running";
          el.textContent = "正在入库…";
          $("ingestBtn").disabled = true;
        } else if (d.status === "done") {
          el.textContent = "入库完成：" + JSON.stringify(d.counts);
          $("ingestBtn").disabled = false;
          refreshStats();
          return;
        } else if (d.status === "error") {
          el.className = "status error";
          el.textContent = "入库失败：" + d.error;
          $("ingestBtn").disabled = false;
          return;
        } else {
          el.textContent = "";
          $("ingestBtn").disabled = false;
          return;
        }
        await new Promise(res => setTimeout(res, 2000));
      }
    }

    $("ingestBtn").addEventListener("click", async () => {
      $("ingestStatus").textContent = "正在启动…";
      const r = await fetch("/api/ingest", { method: "POST" });
      await r.json();
      pollIngest();
    });

    $("askBtn").addEventListener("click", async () => {
      const q = $("question").value.trim();
      if (!q) { $("askStatus").textContent = "请输入问题"; return; }
      $("askStatus").textContent = "正在检索…";
      $("askBtn").disabled = true;
      try {
        const r = await fetch("/api/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: q }),
        });
        const d = await r.json();
        $("askStatus").textContent = "";
        $("answer").textContent = d.answer;
        $("answer").style.display = "block";
        $("sources").innerHTML = d.sources.map(s =>
          `<a href="${s}" target="_blank" rel="noopener">${s}</a>`).join("");
      } catch (e) {
        $("askStatus").textContent = "提问失败：" + e.message;
      } finally {
        $("askBtn").disabled = false;
      }
    });

    $("question").addEventListener("keydown", e => {
      if (e.key === "Enter") $("askBtn").click();
    });

    refreshStats();
  </script>
</body>
</html>
